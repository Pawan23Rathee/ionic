<ion-content>
  <div class="background-container">
    <div class="content">
      <div class="center-container">
        <ion-label class="title">SmartEasy</ion-label>
        <div class="description-container">
          <ion-label class="description">Control your home from anywhere across the globe and add a little more convenience in your life.</ion-label>
        </div>
      </div>
    </div>
    <div class="bottom-buttons">
      <ion-button class="register-button" (click)="newUser()">Register</ion-button>
      <ion-button class="login-button" (click)="skipClick()">Sign In</ion-button>
    </div>
  </div>
</ion-content>
