<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start" >
      <ion-back-button defaultHref="/mainpage" style="color:black"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center" style="color:black">Tuya reg</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

 
  <!-- <ion-button expand="full" (click)="getOtpEnable()">getOtp</ion-button> -->

  <div>
    <form #userForm='ngForm' (ngSubmit)='getOtp(userForm.value)'>
      <ion-item>
        <ion-input id='mail' type='email' placeholder='Enter email here.' class="form-control" name="mail" required roomname='ngModel' ngModel ></ion-input>
      </ion-item>       
      <div style="text-align: center;text-transform: uppercase;"><ion-button color='dark' size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm.invalid'>&nbsp;&nbsp;get otp&nbsp;&nbsp;</ion-button></div>
    </form>
  </div>
  <!-- <ion-button expand="full" (click)="tuyareg()">reg</ion-button> -->

  <div *ngIf="reg"> 
    <form #userForm1='ngForm' (ngSubmit)='tuyareg(userForm1.value)'>
      <ion-item>
        <ion-input id='password' type='text' placeholder='Enter password here.' class="form-control" name="password" required roomname='ngModel' ngModel ></ion-input>
      </ion-item>   
      <ion-item>
        <ion-input id='mail' type='email' placeholder='Enter email here.' class="form-control" name="mail" required roomname='ngModel' ngModel ></ion-input>
      </ion-item>  
      <ion-item>
        <ion-input id='otp' type='text' placeholder='Enter otp here.' class="form-control" name='otp' required roomname='ngModel' ngModel></ion-input>
      </ion-item>  
         
      <div style="text-align: center;text-transform: uppercase;"><ion-button color='dark' size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm1.invalid'>&nbsp;&nbsp;Reg with otp&nbsp;&nbsp;</ion-button></div>
    </form>
  </div>
  <!-- tuyalogin -->
  <!-- <ion-button expand="full" (click)="tuyalogin()">login</ion-button> -->
  <div >
    <form #userForm2='ngForm' (ngSubmit)='tuyalogin(userForm2.value)'>
      <ion-item>
        <ion-input id='mail' type='email' placeholder='Enter email here.' class="form-control" name="mail" required roomname='ngModel' ngModel ></ion-input>
      </ion-item> 
      <ion-item>
        <ion-input id='password' type='text' placeholder='Enter password here.' class="form-control" name="password" required roomname='ngModel' ngModel ></ion-input>
      </ion-item>   
     
     
         
      <div style="text-align: center;text-transform: uppercase;"><ion-button color='dark' size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm2.invalid'>&nbsp;&nbsp;login confirmation &nbsp;&nbsp;</ion-button></div>
    </form>
  </div>
  <br>

  <div>
    <form #userForm3='ngForm' (ngSubmit)='createHome(userForm3.value)'>
      <ion-item>
        <ion-input id='homename' type='text' placeholder='Enter home name.' class="form-control" name="homename" required roomname='ngModel' ngModel ></ion-input>
      </ion-item>       
      <div style="text-align: center;text-transform: uppercase;"><ion-button color='dark' size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm3.invalid'>&nbsp;&nbsp;create home&nbsp;&nbsp;</ion-button></div>
    </form>
  </div>
  <ion-button expand="full" size="round" (click)="createHome(userForm3.value)">create home</ion-button>
</ion-content>
