
<ion-content>
  <ion-row style="text-align: center;margin-top: 17px;">
    <ion-col><ion-button (click)="keyPress('exit_button',$event)" class="exit">exit</ion-button></ion-col>
    <ion-col><ion-button (click)="keyPress('start_button',$event)" class="play">start</ion-button></ion-col>
    <ion-col><ion-button (click)="keyPress('stop_button',$event)" class="record">stop</ion-button></ion-col>
  </ion-row>

  <ion-row style="text-align: center;">
    <ion-col><ion-button (click)="keyPress('exit_button',$event)" class="stop">back</ion-button></ion-col>
    <ion-col><ion-button (click)="keyPress('help_button',$event)" class="pause">help</ion-button></ion-col>
    <ion-col><ion-button (click)="keyPress('forward_button',$event)" class="previous">forward</ion-button></ion-col>
  </ion-row>

  <ion-row style="text-align: center;">
    <ion-col><ion-button (click)="keyPress('backward_button',$event)" class="next">backward</ion-button></ion-col>
    <ion-col ><ion-button (click)="keyPress('mute_button',$event)"class="mute" >vol mute</ion-button></ion-col>
    <ion-col ><ion-button (click)="keyPress('previous_button',$event)"class="mute" >previous</ion-button></ion-col>
  </ion-row>

  <ion-row style="text-align: center;">
    <ion-col><ion-button (click)="keyPress('next_button',$event)" class="next">next</ion-button></ion-col>
    <ion-col ><ion-button (click)="keyPress('fast_forward_button',$event)"class="mute" >fast forward</ion-button></ion-col>
    <ion-col ><ion-button (click)="keyPress('fast_backward_button',$event)"class="mute" >fast backward</ion-button></ion-col>
  </ion-row>

  <ion-row style="text-align: center;">
    <ion-col><ion-button (click)="keyPress('play_button',$event)" class="next">play</ion-button></ion-col>
    <ion-col ><ion-button (click)="keyPress('pause_button',$event)"class="mute" >pause</ion-button></ion-col>
   
  </ion-row>
