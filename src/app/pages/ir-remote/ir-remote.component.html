<ion-header class="ion-no-border">
  <ion-toolbar class="profile-tool">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mainpage" (click)="backbutton()"></ion-back-button>
    </ion-buttons>
    <ion-title class="title-class glbl-clr-white">{{remote}}</ion-title>
  </ion-toolbar>

</ion-header>
<ion-content class="global-background">
  <ion-card style="height: auto" class="opCard global-background" *ngIf="remotetv">
    <ion-grid>
      <ion-row>
        <ion-col style="width: 70px;">
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="power"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Power On</ion-label>
        </ion-col>
        <ion-col style="width: 70px;">
          <ion-button (click)="keyPress('mute_button',$event)" class="power">
            <ion-icon name="volume-mute-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="power">Mute</ion-label>
        </ion-col>
        <ion-col style="width: 70px;">
          <ion-button (click)="keyPress('Power_off_button',$event)" class="menu">
            <ion-icon name="power"></ion-icon>
          </ion-button><br>
          <ion-label class="menu">Power Off</ion-label>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size='4'>
          <div class="voice-channel-div">
            <ion-icon name='add' (click)="keyPress('volume_up_button',$event)" class="voiceplus"></ion-icon>
            <label class="glbl-clr-white">Voice</label>
            <ion-icon name='remove' (click)="keyPress('volume_down_button',$event)" class="voiceminus"></ion-icon>
          </div>
        </ion-col>

        <ion-col size='4'>
          <div>
            <ion-button (click)="keyPress('menu_button',$event)">
              <ion-icon name="menu" (click)="keyPress('menu_button',$event)"></ion-icon>
            </ion-button> <br>
            <ion-button (click)="keyPress('record_button',$event)">
              <ion-icon name="mic-outline" (click)="keyPress('record_button',$event)" class="micro-icon">
              </ion-icon>
            </ion-button>
          </div>
        </ion-col>
        <ion-col size='4'>
          <div class="voice-channel-div">
            <ion-icon name='add' (click)="keyPress('channel_up_button',$event)" class="channelplus"></ion-icon>
            <label class="glbl-clr-white">Channel</label>
            <ion-icon name='remove' (click)="keyPress('channel_down_button',$event)" class="channelminus"></ion-icon>
          </div>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col>
          <div id="div_center" style="
      height: 161px;
      border-radius: 50%; 
      border: 2px solid #dad2d2;
      
      width: 161px;">
            <div style="display: inline-grid;" class="console-btn">
              <ion-col>
                <ion-icon style="margin-top:5px;font-size: 20px;" (click)="keyPress('up_button',$event)" class="caretup"
                  src="assets/iconi5/caret-up-outline.svg"></ion-icon>
              </ion-col>
              <ion-col style="margin-top: 28px;" (click)="keyPress('select_button',$event)">
                <ion-label>OK</ion-label>
              </ion-col>
              <ion-col>
                <ion-icon (click)="keyPress('down_button',$event)" class="caretdown"
                  style="margin-top: 35px;font-size: 20px;" src="assets/iconi5/caret-down-outline.svg"></ion-icon>
              </ion-col>

            </div>
            <div style="margin-top: -86px;" class="console-btn">
              <ion-col>
                <ion-icon style="margin-right: 86px;font-size: 20px;" (click)="keyPress('left_button',$event)"
                  class="caretback" src="assets/iconi5/caret-back-outline.svg" name='caret-back-outline'></ion-icon>
              </ion-col>

              <ion-col>
                <ion-icon style="font-size: 20px;" (click)="keyPress('right_button',$event)" class="caretforward"
                  src="assets/iconi5/caret-forward-outline.svg"></ion-icon>
              </ion-col>
            </div>
          </div>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col style="width: 70px;" (click)='irunmber()'>
          <ion-button>
            <ion-label>123</ion-label>
          </ion-button><br>
          <ion-label>Number</ion-label>
        </ion-col>
        <ion-col style="width: 70px;"> </ion-col>
        <ion-col style="width: 70px;" (click)='irmore()'>
          <ion-button>
            <ion-icon name="more" src="assets/iconi5/ellipsis-vertical-sharp.svg"></ion-icon>
          </ion-button><br>
          <ion-label>More</ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>

  </ion-card>
  <ion-card style="height: 100%;" class="opCard global-background" *ngIf="remoteac">
    <ion-grid>
      <ion-row style="text-align: center;">
        <ion-col>
          <ion-button (click)="power($event)" class="power">
            <ion-icon name="power"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Power On/Off</ion-label>
        </ion-col>
        <ion-col>
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="sync-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Auto</ion-label>
        </ion-col>
        <ion-col>
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="snow-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Cool</ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div>
      <ngx-gauge [value]="gaugeValue" [label]="gaugeLabel" [append]="gaugeAppendText" [size]="200" [min]="16" [max]="30"
        type="arch" [animate]="true" [thick]="9" cap="round" foregroundColor="#ffffff"
        [ngStyle]="{ 'color': 'white' }">

      </ngx-gauge>
      <ion-grid style="margin-top:-27px;">
        <ion-row style="text-align: center;">
          <ion-col>
            <ion-icon name="remove-circle-outline" style="width:30px;height:30px;" class="glbl-clr-white"
              (click)="minus($event)"></ion-icon>
          </ion-col>
          <ion-col>
            <ion-icon name="add-circle-outline" style="width:30px;height:30px;" class="glbl-clr-white"
              (click)="plus($event)"></ion-icon>
          </ion-col>
        </ion-row>
      </ion-grid>


    </div>
    <ion-grid>
      <ion-row style="text-align: center;">
        <ion-col>
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="options-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Dry</ion-label>
        </ion-col>
        <ion-col>
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="sunny-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Heat</ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>
    <ion-grid>
      <ion-row>
        <ion-col>

          <ion-item class="ac-remote global-border">

            <div style="width: 100%;">
              <h5 class="glbl-clr-white">Wind Speed</h5>
              <ion-range (click)="changeVal($event)" min="20" max="80" step="5">
                <ion-icon size="small" slot="start" name="sunny" style="color: white;"></ion-icon>
                <!-- <ion-icon slot="end" name="sunny"></ion-icon> -->
              </ion-range>
            </div>

          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>
    <ion-grid>
      <ion-row style="text-align: center;">
        <ion-col>
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Device Delete</ion-label>
        </ion-col>
        <ion-col>
          <ion-button (click)="keyPress('Power_on_button',$event)" class="power">
            <ion-icon name="calendar-outline"></ion-icon>
          </ion-button><br>
          <ion-label class="tvpower">Schedule Device</ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>

  <!-- MOOD LIGHTING -->
  <ion-card class="opCard global-background" *ngIf="!remotetv && !remoteac">
    <div>
      <div>
        <ion-grid>
          <ion-row>
            <ion-col>
              <ion-button (click)="sendmoodType('Power_on_button')">on</ion-button>
              <ion-button (click)="sendmoodType('Power_off_button')">Off</ion-button>
            </ion-col>
            <ion-col>
              <ion-button (click)="sendmoodType('channel_up_button')">+</ion-button>
              <ion-button (click)="sendmoodType('channel_down_button')">-</ion-button>
            </ion-col>
            <ion-col>
              <ion-button (click)="sendmoodType('mute_button')">Flash</ion-button>
              <ion-button (click)="sendmoodType('menu_button')">Strobe</ion-button>
            </ion-col>
            <ion-col>
              <ion-button (click)="sendmoodType('volume_up_button')">Fade</ion-button>
              <ion-button (click)="sendmoodType('volume_down_button')">Smooth</ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
      <div class="colorpicker">
        <canvas id="picker" var="2" width="300" height="300"></canvas>
      </div>

      <div>
        <div class="controls">
          <div><label>RGB</label> <input type="text" disabled class="preview" /></div>
          <div><label></label> <input type="text" id="hexVal" disabled /></div>

        </div>
        <div>
          <ion-button  (click)="sendmoodcolor()">submit</ion-button>
        </div>


      </div>
    </div>
