<ion-header>
  <ion-toolbar>
    <ion-button (click)='dismiss()' id="btnDrawer" slot="start">
      <ion-icon name="arrow-back" class="menu-icon" item-start></ion-icon>
    </ion-button>
    <ion-title class="glbl-clr-white title-pos"> {{ modeTitle }} </ion-title>
    <ion-button *ngIf='dev_data.length !== 0' (click)='delete=!delete; nodelete=!nodelete' id="btnDrawer" slot="end">
      <ion-icon name="trash" item-start></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>
<ion-content [scrollEvents]="true">
  <div id="dev_disp">
    <div style="width: 100%; text-align: center;" *ngIf='dev_data.length == 0'>
      <h3 style="margin-top: 80px; font-size: large;" class="glbl-clr-white">No Devices</h3>
    </div>
    <div *ngIf='dev_data.length' class="activate">
      <ion-button expand='block' (click)='activate(modId)'>
        <span>ACTIVATE</span>
      </ion-button>
    </div>

    <!-- <ion-list class="global-background"> -->
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-card *ngFor='let d of dev_data' class="global-background card-border">
            <ion-row>
              <ion-col size=4>
                <ion-avatar>
                  <img src="{{d.img}}" *ngIf="d.img">
                  <!-- <img src="../../../assets/HomePage/dyfo.png" *ngIf="!d.img"> -->
                  <img src="../../../assets/kinetics.png" *ngIf="!d.img">
                </ion-avatar>
              </ion-col>
              <ion-col size=4 class="glbl-clr-white">
                <h3>{{d.name}}</h3>
                <h5>{{d.dimmer}}</h5>
              </ion-col>
              <ion-col>
                <!-- <ion-toggle *ngIf='nodelete' style="position: absolute; right: 20px;bottom: 7px;" name='power'
                  checked="{{d.status}}" (ionChange)="notify($event,d.dimmer,d.status,d.mode,d.id)"></ion-toggle> -->
              </ion-col>
            </ion-row>
            <ion-button (click)='del_Mod_device(d.id)' *ngIf='delete' icon-only
              style="position: absolute; right: 20px; font-size: 20px; --background: red;">
              <ion-icon name="trash"></ion-icon>
            </ion-button>
            <div class="dimBox" *ngIf="d.dimmer=='NaN'">
              <ion-range min="0" max="100" value='{{d.dimmer}}' [(ngModel)]='d.dimmer' pin color="secondary"
                id="dimmervalue" disabled="false" (click)="dimmerChange(d.dimmer,d.id)">
              </ion-range>
            </div>
          </ion-card>

        </ion-col>
      </ion-row>
    </ion-grid>
