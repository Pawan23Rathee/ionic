<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" (click)="openMenu()" ion-button menuToggle>
      <ion-icon name="menu-outline" style="font-size: 38px;padding-left: 6px;"></ion-icon>
    </ion-buttons>
    <ion-title class="glbl-clr-white glbl-text-cntr">Home</ion-title>

    <ion-buttons slot="end" style="padding-right: 15px;" (click)="devices()">
      <ion-icon name="add" class="glbl-clr-white xx-large-font"></ion-icon>
    </ion-buttons>
    <!-- <ion-buttons slot="end" (click)="notificationClick()">
      <ion-icon name="notifications-outline" style="font-size:20px;padding-right: 10px;" class="glbl-clr-white">
      </ion-icon>
    </ion-buttons> -->
  </ion-toolbar>
</ion-header>
<app-side-menu></app-side-menu>

<ion-content>
  <ion-card class="welcome-card">
    <ion-card-header style="text-align: center;">
      <ion-card-subtitle class="color-black">Total Units Consumed: Last 7 Days</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <canvas #barChartTotalweekly></canvas>
    </ion-card-content>
  </ion-card>
  <ion-grid>
    <ion-row>
      <ion-col size=6>
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>
              <ion-icon name="bulb" class="on-color xx-large-font"></ion-icon>
              <ion-label class="count-label">{{turnOnDeviceCount}}</ion-label>
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-label class="large-font color-black">Turned On</ion-label>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size=6>
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>
              <ion-icon name="bulb" class="off-color xx-large-font"></ion-icon>
              <ion-label class="count-label">{{turnOffDeviceCount}}</ion-label>
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-label class="large-font color-black">Turned Off</ion-label>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
    <!-- Scene section -->
   
    <ion-row class="scene-row">
      <!-- <ion-row class="title-row"> -->
        <ion-label class="large-font">Scenes Shortcuts</ion-label>
        <ion-col class="glbl-text-cntr">
          <ion-icon name="add" class="on-color xx-large-font float-pos" (click)="addScene()"></ion-icon>
        </ion-col>
      <!-- </ion-row> -->
      <ion-col>
        <swiper-container #swiper>
          <swiper-slide *ngFor='let scene of scenes' class="swi-slide">
            <ion-button style="width: 150px;" fill="outline" class="slide-button">{{scene.name}}</ion-button>
          </swiper-slide>
        </swiper-container>
      </ion-col>
    </ion-row>
    <!-- Fav section -->
    
    <ion-row class="scene-row fav-section">
      <!-- <ion-row class="title-row"> -->
        <ion-label class="large-font">Favourite</ion-label>
        <ion-col class="glbl-text-cntr">
          <ion-icon name="add" class="on-color xx-large-font float-pos" (click)="favpage()"></ion-icon>
        </ion-col>
      <!-- </ion-row> -->
      <ion-col size=12>
        <swiper-container #swiper>
          <swiper-slide *ngFor='let fav of favourite' class="swi-slide">
            <ion-button style="width: 150px;" fill="outline" class="slide-button">{{fav.device_name}}</ion-button>
          </swiper-slide>
        </swiper-container>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<app-footer></app-footer>
