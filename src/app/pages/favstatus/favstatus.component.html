<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start" style="position:absolute">
      <ion-back-button defaultHref="/favlist" ></ion-back-button>
    </ion-buttons>
    <ion-title style="text-align: center; text-transform: lowercase;">
      {{d_name}}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="delete_dev(user.moodDevice_id,dd_id)">
        <ion-icon slot="icon-only" name='trash'></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <!-- <div>
    <ion-button id='ion-btn' [ngClass]="is_online_status == 'true' ? 'on':'off'"
      style="float: right; display: inline; font-size: 0px; margin: 5px; --border-radius: 74px; width: 35px; height: 35px; padding: 0;  --background: transparent;">
      <ion-icon style="font-size: 25px;margin-right: 6px;" name='power' slot="end"></ion-icon>
    </ion-button>
  </div> -->

  <ion-card class="statusCard" *ngFor="let l of lock_response">

    <img style="width: 100%; height: 100%;" id={{l.id}} src="{{l.img}}" (click)="changeStatus($event,l.id,l.status)">



  </ion-card>
  <div *ngFor="let m of lock_response">
    <div *ngIf="(m.status=='1' || m.status=='true') && (m.is_dimmer=='true' || m.is_dimmer=='1') "
      style="margin-top: 167px;">
      <ion-range  min="{{m.minimum}}" max="{{m.maximum}}" pin="true" id="dimmervalue"
        (click)="setDimmer(m.device)" value="{{m.dimmer}}"></ion-range>
    </div>
  </div>




</ion-content>
