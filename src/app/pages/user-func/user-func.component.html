<ion-header class="ion-no-border">
  <ion-toolbar >
    <ion-buttons slot="start" style="position:absolute">
      <ion-back-button defaultHref="/mainpage" ></ion-back-button>
    </ion-buttons>
    <ion-title style="text-align: center;">User for Lock</ion-title>
    <ion-buttons slot="end" >
      <ion-button (click)="addUser()">
        <ion-icon  name="add-outline" slot="end" style="font-size: 30px;margin-right: 10px;"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-card>
    <ion-item *ngFor='let u of lockUser'>
      <ion-grid>
      <ion-row>
        <ion-col size="8">
          <label>{{u.userName}}</label>
        </ion-col>
        <ion-col size="2" class="colIcon">
          <ion-buttons>
            <ion-button (click)="updateUser(u.id,'Family Member')" >
              <ion-icon name="create-outline" style="font-size: 23px;"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-col>
        <ion-col size="2" class="colIcon">
          <ion-buttons>
            <ion-button (click)="deleteUser(u.id)">
            
              <ion-icon name="trash-outline" style="font-size: 20px;"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-col>
      </ion-row>
      </ion-grid>
    </ion-item>
  </ion-card>

  <div class="editEnter" *ngIf='editenter'>
    <ion-card style="border-radius: 21px;top: 15%;">
      <ion-list>
        <ion-item>
          <ion-label><p>Please enter text here</p></ion-label>
          <ion-icon name='close' slot="end" color="dark" (click)='editenter=!editenter'></ion-icon>
        </ion-item>
        <form #userForm='ngForm' (ngSubmit)='editDestails(userForm.value)'>
        <ion-item>
          <ion-input id='otp' type='text' placeholder='Enter otp here.' class="form-control" name='detail' required roomname='ngModel' ngModel ></ion-input>
        </ion-item>       
        <div style="text-align: center;text-transform: uppercase;"><ion-button color='dark' size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm.invalid'>&nbsp;&nbsp;Submit&nbsp;&nbsp;</ion-button></div>
      </form>
      </ion-list>
    </ion-card>
  </div>
</ion-content>
