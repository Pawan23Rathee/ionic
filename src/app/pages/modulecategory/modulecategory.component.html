<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start" style="position:absolute">
      <ion-back-button defaultHref="/mainpage"></ion-back-button>
    </ion-buttons>
    <ion-title style="text-align: center;" class="glbl-clr-white">
      SET UP A DEVICE
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size=12>
        <ion-card (click)='automationmodule()' class="card-cls">
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/Automation.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">Automation</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size=12>
        <ion-card (click)='securitymodule()' class="card-cls">
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/security.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">Security</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <!-- <ion-col size=6>
        <ion-card (click)='modulesensorclick()' class="card-cls">

            <ion-label  class="label-cls">Sensor</ion-label>
          </ion-card-content>
        </ion-card>
      </ion-col> -->
      <!-- <ion-col size=6>

            <ion-label  class="label-cls">Security</ion-label>
          </ion-card-content>
        </ion-card>
      </ion-col> -->

  </ion-grid>
</ion-content>
