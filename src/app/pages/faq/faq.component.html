<ion-header translucent class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mcategory" (click)="backbutton()" ></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center glbl-clr-white">Hardware Sync</ion-title>
    <ion-buttons slot="end">
      <ion-icon (click)="addDevice1()" name="add-circle-outline" slot="end" style="font-size: 30px;margin-right: 10px;"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="global-background">

  <ion-item style="text-align: center" class="global-brackground glbl-clr-white">
    Select valid credential <ion-icon slot="end" name='refresh' (click)="getbothnetwork()"></ion-icon>
  </ion-item>

  <div class="adddevice" *ngIf='addDevicepi'>
    <ion-card class="add-device-card">
      <ion-list class="global-background">
        <ion-item>
          <ion-label>
            <p>Enter alpha numeric value.</p>
          </ion-label>
          <ion-icon name='close' slot="end" (click)='addDevicepi=!addDevicepi'></ion-icon>
        </ion-item>
        <form #userForm='ngForm' (ngSubmit)='submitDevicePi(userForm.value)'>
          <ion-item no-lines class="ion-item-popup">
            <ion-input id='deviceadd' type="text" placeholder='Enter alpha numeric value.' class="form-control glbl-clr-white"
              name='deviceadd' required roomname='ngModel' ngModel maxlength='15'></ion-input>
          </ion-item>
          <div style="text-align: center;text-transform: uppercase;">
            <ion-button size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm.invalid'>
            <!-- <ion-button color='light' size='small' type='submit' style="margin-top: 15px;"> -->
              &nbsp;&nbsp;Submit&nbsp;&nbsp;</ion-button>
          </div>
        </form>
      </ion-list>
    </ion-card>
  </div>

  <!-- <ion-button color="primary" (click)="getbothnetwork();">Get Networks</ion-button> -->
  <!-- {{info_txt}} -->

  <ion-list *ngFor="let data of results1" class="global-background">
    <ion-item *ngIf="data.SSID!=''" (click)="wificheck(data.SSID)" detail>
      <ion-avatar slot="start" *ngIf="data.SSID.match('DYFO')">
        <img src="../../../assets/HomePage/thomes.png" />
      </ion-avatar>
      <ion-avatar slot="start" *ngIf="data.SSID.match('dyfo')">
        <img src="../../../assets/HomePage/thomes.png" />
      </ion-avatar>
      <ion-avatar slot="start" *ngIf="data.SSID.match('M-300')">
        <img src="../../../assets/product_image/doorlock.png">
      </ion-avatar>
      <ion-avatar slot="start" *ngIf="data.SSID.match('M-500')">
        <img src="../../../assets/product_image/doorlock.png">
      </ion-avatar>
      <ion-label>
        <p style="margin-left: 10px;" class="glbl-clr-white">{{data.SSID}}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
