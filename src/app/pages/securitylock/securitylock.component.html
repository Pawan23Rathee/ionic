<ion-header translucent class="ion-no-border">
  <!-- <ion-toolbar style="--background: rgb(245, 248, 248); "> -->
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mainpage"></ion-back-button>
    </ion-buttons>
    <ion-title class="glbl-clr-white glbl-text-cntr">
      Security Devices
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div>

    <ion-grid *ngIf="user.r_select_type=='rectangle'">
      <ion-row>
        <ion-col *ngFor='let d of allDevices' (click)="allDevicesClick(d)" size='4' style="text-align: center;">
          <ion-card class="roomcard global-backgroun">
            <div style="display: flex; align-items: center;justify-content: center;height: 100%;">
              <img *ngIf='d.type=="ttlock"' src='../../../assets/images/bluetoothLock.png' style="height: 65px;">
              <img *ngIf='d.type=="gateway"' src='../../../assets/images/wifiBluetoothLock.png' style="height: 65px;">
              <img *ngIf='d.type=="tuya"' src='{{d.item.icon}}' style="width: 95px;height: 90px;">
              <img *ngIf='d.type=="lock"' src='../../../assets/images/atiWifiLock.png' style="height: 65px;">
            </div>
          </ion-card>
          <ion-item *ngIf='d.type=="ttlock"' style="font-size: 13px;" class="glbl-clr-white global-border">{{d.item.lockName}}</ion-item>
          <ion-item *ngIf='d.type=="tuya" || d.type=="gateway"' style="font-size: 13px;" class="glbl-clr-white global-border">{{d.item.name}}</ion-item>
          <ion-item *ngIf='d.type=="lock"' style="font-size: 13px;" class="glbl-clr-white global-border">{{d.item.device_name}}</ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-grid *ngIf="user.r_select_type=='circle'">
      <ion-row>
        <ion-col *ngFor='let d of allDevices' (click)="allDevicesClick(d)" size='4' style="text-align: center;">
          <ion-card class="roomCircleCard global-background">
            <div style="display: flex; align-items: center;justify-content: center;height: 100%;">
              <img *ngIf='d.type=="ttlock"' src='../../../assets/images/bluetoothLock.png' style="height: 65px;">
              <img *ngIf='d.type=="gateway"' src='../../../assets/images/wifiBluetoothLock.png' style="height: 65px;">
              <img *ngIf='d.type=="tuya"' src='{{d.item.icon}}' style="width: 95px;height: 90px;">
              <img *ngIf='d.type=="lock"' src='../../../assets/images/atiWifiLock.png' style="height: 65px;">
            </div>
          </ion-card>
          <ion-item *ngIf='d.type=="ttlock"' style="font-size: 13px;" class="glbl-clr-white global-border">{{d.item.lockName}}</ion-item>
          <ion-item *ngIf='d.type=="tuya" || d.type=="gateway"' style="font-size: 13px;" class="glbl-clr-white global-border">{{d.item.name}}</ion-item>
          <ion-item *ngIf='d.type=="lock"' style="font-size: 13px;" class="glbl-clr-white global-border">{{d.item.device_name}}</ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
