<ion-header translucent class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mcategory"></ion-back-button>
    </ion-buttons>

    <ion-title class="glbl-text-cntr glbl-clr-white">Automation Module</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size=12>
        <ion-card class="card-cls" (click)='moduledeviceclick()'>
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/touch module.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">In-wall and Touch Module</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size=12>
        <ion-card (click)='moduleplugclick()' class="card-cls">
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/plug.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">Plug</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size=12>
        <ion-card (click)='moduledeviceclick1()' class="card-cls">
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/Hub.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">Hub</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size=12>
        <ion-card (click)='modulecurtainclick()' class="card-cls">
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/curtain_motor.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">Curtain Motor</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size=12>
        <ion-card (click)='rgbaddclick()' class="card-cls">
          <ion-card-content class="ion-text-center">
            <ion-row>
              <ion-col size=3>
                <img src="../../../assets/addnew/RGB light.png">
              </ion-col>
              <ion-col size=9 class="verti-align">
                <ion-label class="label-cls">RGB Lights</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
