<ion-header class="ion-no-border">
  <ion-toolbar >
    <ion-buttons slot="start" style="position:absolute">
      <ion-back-button defaultHref="/lockFunc" ></ion-back-button>
    </ion-buttons>
    <ion-title style="text-align: center;">Temporary PW</ion-title>
    <ion-buttons slot="end" >
      <ion-button (click)="addPass()">
        <ion-icon  name="add-outline" slot="end" style="font-size: 30px;margin-right: 10px;"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-card id="round" *ngFor="let p of allTempPass">
    <ion-item>
      <ion-grid>
      <ion-row>
        <ion-col size="8">
          <h5>{{p.name}}   <span>({{p.status}})</span></h5>
        </ion-col>
        <ion-col size="3" class="colIcon">
          <ion-buttons>
            <ion-button  (click)="deleteTempPassword(p.passId)" >
              <ion-icon id="dlBtn" name="trash-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <p><span>{{p.startTime}}</span> ~</p> 
          <p><span>{{p.endTime}}</span></p>
        </ion-col>
      </ion-row>
    </ion-grid>
    </ion-item>
  </ion-card>

   <div id="editEnter">
  <ion-card  style="border-radius: 21px;top: 15%;">
    <ion-list>
      <ion-item>
        <ion-label><p>Add Temporary Password..</p></ion-label>
        <ion-icon name='close' slot="end" color="dark" (click)='toShow()'></ion-icon>
      </ion-item>
      <form #userForm='ngForm' (ngSubmit)='updatelockPass(userForm.value)'>
        <ion-item>
          <ion-input id='otp' type='text' placeholder='Enter User Name.' class="form-control" name='name' required  ngModel ></ion-input>
        </ion-item>   
        <ion-item>
          <ion-input id='otp' type='text' placeholder='Enter 7 digit Password.' class="form-control" name='pass' required ngModel ></ion-input>
        </ion-item>  
      <ion-item>
        <ion-label>Start Time</ion-label>
        <ion-datetime display-format="MMM DD, YYYY HH:mm:ss" picker-format="MMM DD, YY HH:mm:ss" ngModel [(ngModel)]="startDate" name="startDate" [ngModelOptions]="{standalone: true}" ></ion-datetime>

      </ion-item> 
      <ion-item>
        <ion-label>End Time</ion-label>
        <ion-datetime display-format="MMM DD, YYYY HH:mm:ss" picker-format="MMM DD, YY HH:mm:ss" ngModel [(ngModel)]="endDate" name="endDate" [ngModelOptions]="{standalone: true}"></ion-datetime>
      </ion-item>   
      <div style="text-align: center;text-transform: uppercase;"><ion-button color='dark' size='small' type='submit' style="margin-top: 15px;" [disabled]='userForm.invalid'>&nbsp;&nbsp;Submit&nbsp;&nbsp;</ion-button></div>
    </form>
 </ion-list>
  </ion-card>
</div>
</ion-content>
