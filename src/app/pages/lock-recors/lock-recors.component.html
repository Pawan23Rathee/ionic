<ion-header class="ion-no-border">
  <ion-toolbar >
    <ion-buttons slot="start" style="position:absolute">
      <ion-back-button defaultHref="/lockFunc" ></ion-back-button>
    </ion-buttons>
    <ion-title style="text-align: center;">
      Lock Records
    </ion-title>  
  </ion-toolbar>
</ion-header>
<ion-content>
  <div>
    <!-- <h5>{{lockRecords[0].head}}</h5> -->
  <ion-card *ngFor="let r of lockRecords">
    <ion-grid>
      <ion-row>
       <ion-col size="5">
         <img src="{{r.Icon}}" width="30px"> 
         <ion-text>{{r.UserName}}</ion-text>
       </ion-col>
       <ion-col size="6">
        {{r.createTime}}
     </ion-col>
     <ion-col>
       ({{r.Status}})
     </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</div>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-grid>
      <ion-row>
      <ion-col size="5">
    <ion-button  id="hide" (click)="getUnlockRecords()" >Unlock Records</ion-button>
    <ion-button  id="show" (click)="getLockRecords()" >Lock Records</ion-button>
      </ion-col>
      <ion-col size="5">
    <ion-button (click)="getHijackRecords()"  full>Hijack Records</ion-button>
  </ion-col>
  </ion-row>
  </ion-grid>
  </ion-toolbar>
</ion-footer>
