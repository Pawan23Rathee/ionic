<ion-header translucent class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mainpage" (click)="backbutton()" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center glbl-clr-white">Water Devices</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div>
    <ion-grid *ngIf="user.r_select_type=='circle'">
      <ion-row>
        <ion-col *ngFor="let d of devices" size='4' style="text-align: center;">
          <ion-card class="roomCircleCard" (click)="goToWaterDevice(d.name,d.device,d.id,d.is_online)">
            <ion-icon name="beaker" size="large" color="light"></ion-icon>
            <br><span style="font-size: 15px;" class="glbl-clr-white">{{d.name}}</span>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>




<ion-footer class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-tabs>
      <ion-tab-bar slot="bottom" style="padding-bottom: 9px;padding-top: 5px;">

        <ion-tab-button (click)="mainpage()" class="home">
          <ion-icon name="home-outline"></ion-icon>
          <ion-label style="padding: 0;">Home</ion-label>
        </ion-tab-button>

        <!--<ion-tab-button  > 
          <ion-icon name="heart-outline" class="favourite"></ion-icon>
          <ion-label style="padding: 0;">Favourite</ion-label>
        </ion-tab-button>-->
        <ion-tab-button (click)="rgbpage()" class="favourite">
          <ion-icon name="bulb-outline"></ion-icon>
          <ion-label>RGB Devices</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="securitylockpage()" class="security">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <ion-label style="padding: 0;">Security</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="modepage()" class="mode">
          <ion-icon name="aperture-outline"></ion-icon>
          <ion-label style="padding: 0;">Scene</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
