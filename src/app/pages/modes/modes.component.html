<ion-header class="ion-no-border">
  <ion-toolbar class="global-background">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mainpage" (click)="backbutton()"></ion-back-button>
    </ion-buttons>
    <ion-title class="title-pos glbl-clr-white">Scenes</ion-title>
    <!-- <ion-buttons slot="end">
      <ion-icon slot="end" name="add-circle-outline" style="font-size:35px;" (click)="addMode()"></ion-icon>
    </ion-buttons> -->
  </ion-toolbar>
</ion-header>
<app-side-menu></app-side-menu>
<ion-content fullscreen class="back">
  <!-- display modes -->
  <ion-fab horizontal="end" vertical="bottom" slot="fixed">
    <ion-fab-button class="fav-button-clr" (click)="addMode()" size="large">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <ion-row>
    <ion-col size=6 *ngFor="let i of source">
      <ion-card class="inactive scene-card">
        <ion-card-content>
          <ion-row>
            <ion-col class="12 glbl-text-cntr">
              <ion-label><b>{{i.mname}}</b></ion-label>
            </ion-col>

            <ion-col size="12">
              <div (click)='showAppl(i)'><img src="{{i.img}}"></div>
            </ion-col>
            <ion-col size="12" class="card-bottom">
              <ion-col size="6">
                <button ion-button icon-only class="delMode" (click)='deleteMode(i.id)'>
                  <ion-icon name="trash" class="x-large-font"></ion-icon>
                </button>
              </ion-col>
              <ion-col size="6" class="glbl-text-right">
                <button ion-button icon-only class="editmode" (click)='editClick(i)'>
                  <ion-icon name="cog" class="x-large-font"></ion-icon>
                </button>
              </ion-col>
            </ion-col>
          </ion-row>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>

  <!-- edit mode-->
  <div class="fullscreen-container" *ngIf="editMod">
    <ion-card class="editpopdiv">
      <form style="height: 100%;" #form="ngForm" (ngSubmit)="saveeditMode(form)" (keyup.enter)="saveeditMode(form)">
        <ion-card-content style="height: 80%;">
          <ion-item>
            <ion-label>Please select room first</ion-label>
            <ion-select (ionChange)="checkValue($event)" interface="popover" placeholder="">
              <ion-select-option *ngFor='let r of myRooms' [value]="r"> {{r.name}}</ion-select-option>
            </ion-select>
          </ion-item>
          <!-- ......To select device............ -->
          <div *ngIf="showDevices">
            <!-- <ion-item *ngIf='dev_ToSelect.length == 0'><span>Sorry!</span></ion-item> -->
            <ion-item>
              <ion-label>Select Devices</ion-label>
              <ion-select [(ngModel)]="selectedDevs" name="deviceSelect" multiple="true" cancelText="Cancel" okText="OK"
                (ionChange)='dev_det_box=true'>
                <ion-select-option *ngFor='let dev of deviceAll' value="Device1" [value]="dev">{{dev.device_name}}
                </ion-select-option>
              </ion-select>
            </ion-item>

          </div>
          <p *ngIf="noshowDevices" class="pText">No Devices found in this room. please select another room.</p>
          <!-- ................................ -->

          <!-- ........Open Box To set device detail...................... -->
          <div class="dev_status">
            <ion-item *ngFor='let d of selectedDevs'>
              <div class="toogleBox">
                <span>{{d.device_name}}</span>
                <ion-toggle style="position: absolute; right: 20px;" name='power' slot="end" [(ngModel)]="d.status"
                  [ngModelOptions]="{standalone: true}" checked="{{d.status}}" (ionChange)="power(d.status)">
                </ion-toggle>
                <div class="dimBox" *ngIf="d.is_dimmer=='True'">
                  <ion-range min="{{d.minimum}}" max="{{d.maximum}}" [(ngModel)]='d.dimmer'
                    [ngModelOptions]="{standalone: true}" pin color="secondary" id="dimmervalue"
                    (ionChange)="dimmer(d.dimmer)">
                  </ion-range>
                </div>
              </div>

            </ion-item>
          </div>
          <!-- .................................................... -->
        </ion-card-content>

        <ion-row class="cardfooter">
          <ion-col>
            <ion-button (click)="editMod=!editMod">Cancel</ion-button>
          </ion-col>
          <ion-col>
            <ion-button type="submit">Save</ion-button>
          </ion-col>
        </ion-row>
      </form>
    </ion-card>
  </div>
  <!-- ..........end edit -->


</ion-content>
