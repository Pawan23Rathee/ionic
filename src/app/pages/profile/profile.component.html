<ion-header translucent class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mainpage"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center glbl-clr-white">user settings</ion-title>
    <ion-buttons slot="end" (click)="enable()">
      <ion-button>
        <ion-icon slot="icon-only" class="glbl-clr-white" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-card class="global-background global-border">
    <div class="img-wrapper" (click)="selectImage()">
      <img src="../../../assets/HomePage/thomes.png" />
    </div>
    <div style="text-align: center;">
      <h3 class="glbl-clr-white">{{name}}</h3>
      <ion-grid style="text-align: center;">
        <ion-row no-padding>
          <ion-col size="3" style="padding: 0;">
            <div style="display: grid;">
              <p class="glbl-clr-white">Rooms</p>
              <ion-label style="font-size: 13px" class="glbl-clr-white">{{user.total_Room}}</ion-label>
            </div>

          </ion-col>
          <ion-col size="1" style="display: grid;">
            <ion-label style="font-size: 29px;">|</ion-label>
          </ion-col>
          <ion-col size="3" style="padding: 0;">
            <div style="display: grid;">
              <p class="glbl-clr-white">Devices</p>
              <ion-label style="font-size: 13px" class="glbl-clr-white">{{user.total_device_online}}/{{user.total_Devices}}
              </ion-label>
            </div>

          </ion-col>
          <ion-col size="1" style="display: grid;">
            <ion-label style="font-size: 29px;">|</ion-label>
          </ion-col>
          <ion-col size="3" style="padding: 0;">
            <div style="display: grid;">
              <p  class="glbl-clr-white">Energy</p>
              <ion-label style="font-size: 13px" class="glbl-clr-white">45kw</ion-label>
            </div>

          </ion-col>
        </ion-row>
      </ion-grid>
      <!-- <ion-item style="--background: #f4f5f8;text-align: center;">
         <ion-label style="text-align: center;">Rooms: {{user.total_Room}}</ion-label>
         <ion-label >Device:{{user.total_device_online}}/{{user.total_Devices}}</ion-label>
        </ion-item> -->
    </div>
  </ion-card>
  <div>
    <form #form="ngForm" (ngSubmit)="updatedetails(form)" (keyup.enter)="updatedetails(form)">
      <ion-list style="background: none;" no-lines>
        <ion-item no-lines line="none">
          <!-- <ion-label style="color: white;"><p>Name</p></ion-label> -->
          <ion-icon name="person" slot="start" class="glbl-clr-white"></ion-icon>
          <ion-input style="font-size: 17px;" type="text" name="name" [(ngModel)]="name" disabled ngModel
            class="form-control" class="ion-input"></ion-input>
        </ion-item>
        <ion-item no-lines line="none">
          <!-- <ion-label ><p>Phone Number</p></ion-label>   -->
          <ion-icon slot="start" name="call" class="glbl-clr-white"></ion-icon>
          <ion-input style="font-size: 17px;" type="tel" name="mobile" [(ngModel)]="mobile" minlength="10"
            maxlength="10" disabled ngmodel class="form-control" class="ion-input"> </ion-input>

        </ion-item>
        <ion-item no-lines line="none">
          <!-- <ion-label ><p>Email</p></ion-label>   -->
          <ion-icon slot="start" name="mail" class="glbl-clr-white"></ion-icon>
          <ion-input style="font-size: 17px;" type="email" name="email" id="user-mail" [(ngModel)]="email" disabled
            class="form-control" class="ion-mail"></ion-input>
          <ion-icon slot="end" name="checkmark-circle-outline" class="validmail" style="color: green;"
            *ngIf="emailvalide"></ion-icon>
          <ion-icon name="create" slot="end" disabled (click)='validateEmail()' type='submit' *ngIf="emailinvalide" class="glbl-clr-white">
          </ion-icon>
        </ion-item>
        <ion-item detail (click)='changePassword()' line="none">
          <ion-icon name="lock-closed" slot="start" class="glbl-clr-white"></ion-icon>
          <ion-label>
            <p>Update Password</p>
          </ion-label>
        </ion-item>
      </ion-list>
      <div class="ion-padding" style="display: none;">
        <ion-button expand="block" style="margin-top: 15px;opacity: 9;
        
        /* border-top: 1px solid #e6e6e6;
        border-bottom: 1px solid #e6e6e6; */
        width: 90%;
        margin-left: 0px;" class="ion-no-margin" type="submit">Update</ion-button>
      </div>
    </form>
    <ion-item (click)="logout()">
      <ion-label>
        <p style="padding-left: 31px;">Sign Out</p>
      </ion-label>
      <ion-icon name="log-out" slot="start" class="glbl-clr-white"></ion-icon>
    </ion-item>
  </div>
  <!-- <div>
    <img style="width: 100px;height: 100px;border-radius: 21px;" class="user-profile-img" src="{{userImg}}" alt=""
      (click)="selectImage()">
  </div> -->
  <div class="otpEnter" *ngIf='otpenter'>
  <!-- <div class="otpEnter"> -->
    <ion-card style="border-radius: 21px;top: 15%;" class="otp">
      <!-- <ion-list style="background: #2F3C5F;margin-top: -25px;"> -->
        <ion-card-header>
          <ion-icon name='close' (click)='otpenter=!otpenter' style="float: right;color: black;"></ion-icon>
          <ion-card-title style="color: black;">Please enter one time verification code send to &nbsp;{{email}}</ion-card-title>
        </ion-card-header>

        <!-- <ion-item>
          
          
        </ion-item> -->
        <form #userForm='ngForm' (ngSubmit)='validateOTP(userForm.value)'>
          <ion-item class="otp-input">
            <ion-input id='otp' type='number' placeholder='Enter otp here.' class="form-control otp-input" name='otp' required
              roomname='ngModel' ngModel maxlength='6'></ion-input>
          </ion-item>
          <div style="text-align: center;text-transform: uppercase;">
            <ion-button size='small' type='submit' style="margin-top: 15px;opacity: 9;" [disabled]='userForm.invalid'>
              &nbsp;&nbsp;Submit&nbsp;&nbsp;</ion-button>
          </div>
        </form>
      <!-- </ion-list> -->
    </ion-card>
  </div>
</ion-content>
