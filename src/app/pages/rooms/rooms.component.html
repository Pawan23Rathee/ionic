<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="" (click)="navBack()"></ion-back-button>
    </ion-buttons>
    <ion-title class="glbl-clr-white title-position">Rooms</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-row>
    <ion-col size=12>
      <div *ngIf="!myRooms" style="text-align: center;padding: 50px;margin-top: 50px;">
        <p>Add your  devices here for easy control</p>
        <!-- <ion-button expand="round" class="nofav_button fav-button-clr" (click)='add_fav_device()'>
          <ion-icon slot="icon-only" name="add"></ion-icon>
        </ion-button> -->
      
      </div>
    </ion-col>
    <ion-col size=6 *ngFor="let room of myRooms" class="glbl-text-cntr">
      <ion-card class="room-card">
        <ion-row class="card-row">
          <ion-col size=12>
            <ion-label class="x-large-font">{{room.on_device_count}}</ion-label>
            <div *ngIf="room.on_device_count > 0" class="class-on"style=""></div>
          </ion-col>
          <ion-col size=12 (click)="getAllRoom($event,room.id,room.name)">
            <!-- <ion-label class="x-large-font">{{room.room_type}}</ion-label> -->
            <ion-label class="large-font">{{room.name}}</ion-label>
          </ion-col>
          <ion-col size=12 class="align-right">
            <ion-icon name="power" class="x-large-font" (click)="turnRoomDeviceOff(room.id,room.on_device_count)"></ion-icon>
          </ion-col>

        </ion-row>
        
      </ion-card>
    </ion-col>
  </ion-row>
  <ion-fab horizontal="end" vertical="bottom" slot="fixed" (click)="addDevices()">
    <ion-fab-button class="fav-button-clr" size="large">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<app-footer></app-footer>
