<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mcategory"></ion-back-button>
    </ion-buttons>
    <ion-title style="text-align: center;" class="glbl-clr-white">
      Security Devices
    </ion-title>
  </ion-toolbar>
</ion-header>

<!-- <ion-content style=" --background: #d7d8da4a;"> -->
<ion-content>
  <ion-grid>
    <ion-row>
      <!-- THomes Lock -->
      <ion-col size=12>
        <ion-card class="card-cls" (click)='clickDyfolockModule()'>
          <ion-card-content class="card-content-cls">
            <ion-row>
              <ion-col size=2>
                <img src="../../../assets/addnew/Thome_lock.png" class="security-img">
              </ion-col>
              <ion-col size=10>
                <ion-label class="label-cls">THomes Lock</ion-label>
              </ion-col>
            </ion-row>
            <!-- <ion-avatar slot="start" class="avatar-class"> -->
              
            <!-- </ion-avatar> -->

            
          </ion-card-content>
        </ion-card>
      </ion-col>
      <!-- Bluetooth Lock-->
      <ion-col size=12>
        <ion-card class="card-cls" (click)='addTTlock()'>
          <ion-card-content class="card-content-cls">
            <ion-row>
              <ion-col size=2>
                <img src="../../../assets/addnew/Bluetooth_lock.png" class="security-img">
              </ion-col>
              <ion-col size=10>
                <ion-label class="label-cls">Bluetooth Lock</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <!-- Bluetooth Gateway Lock -->
      <ion-col size=12>
        <ion-card class="card-cls" (click)='addTTlockGateway()'>
          <ion-card-content class="card-content-cls">
            <ion-row>
              <ion-col size=2>
                <img src="../../../assets/addnew/bluetooth_gateway_lock.png" class="security-img">
              </ion-col>
              <ion-col size=10>
                <ion-label class="label-cls">Bluetooth Gateway Lock</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <!--Wi-Fi Lock  -->
      <ion-col size=12>
        <ion-card class="card-cls" (click)='addTuyadoorLock()'>
          <ion-card-content class="card-content-cls">
            <ion-row>
              <ion-col size=2>
                <img src="../../../assets/addnew/Wifi_lock.png" class="security-img">
              </ion-col>
              <ion-col size=10>
                <ion-label class="label-cls">Wi-Fi Lock</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <!-- Camera -->
      <ion-col size=12>
        <ion-card class="card-cls" (click)='addTuyadoorBell()'>
          <ion-card-content class="card-content-cls">
            <ion-row>
              <ion-col size=2>
                <img src="../../../assets/addnew/camra.png" class="security-img">
              </ion-col>
              <ion-col size=10>
                <ion-label class="label-cls">Camera</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <!-- DoorBell -->
      <ion-col size=12>
        <ion-card class="card-cls" (click)='addTuyadoorBell()'>
          <ion-card-content class="card-content-cls">
            <ion-row>
              <ion-col size=2>
                <img src="../../../assets/addnew/Door bell.png" class="security-img">
              </ion-col>
              <ion-col size=10>
                <ion-label class="label-cls">DoorBell</ion-label>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
